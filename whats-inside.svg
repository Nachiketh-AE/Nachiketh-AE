<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">What is inside the portfolio</title><desc id="d">Six animated cards: pipeline hero, capabilities, impact metrics, case studies, experience timeline, and stack and principles.</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.c{opacity:0;animation:in .7s ease forwards}@keyframes in{to{opacity:1}}
.pl{animation:pl 3s ease-in-out infinite}@keyframes pl{0%,100%{opacity:.25}40%{opacity:1}}
.gr{transform-box:fill-box;transform-origin:bottom;animation:gr 3s ease-in-out infinite}@keyframes gr{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
.tk{stroke-dasharray:20;animation:tk 3.2s infinite}@keyframes tk{0%,20%{stroke-dashoffset:20}45%,90%{stroke-dashoffset:0}100%{stroke-dashoffset:20}}
.nd{animation:nd 3s infinite}@keyframes nd{0%,100%{fill:#0d1117}35%{fill:#38bdf8}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.c{opacity:1}.mv{display:none}.pl{opacity:1}}</style>
<rect x=".75" y=".75" width="998.5" height="438.5" rx="14" fill="#0d1117" stroke="#262d38" stroke-width="1.5"/>
<text x="40" y="56" font-size="24" font-weight="700" fill="#e8edf3">A portfolio built like a data pipeline</text>
<text x="40" y="82" font-size="14" fill="#9aa6b5">Raw, fragmented business data becomes trusted, reusable analytical datasets. One static page, no dependencies, no build step.</text>
<g class="c" style="animation-delay:0.0s"><rect x="40" y="112" width="288" height="144" rx="10" fill="#151a22" stroke="#262d38"/><text x="64" y="146" font-size="16" font-weight="600" fill="#e8edf3">Animated pipeline hero</text><text x="64" y="170" font-size="12.5" fill="#9aa6b5">Six stages, from sources to delivery,</text><text x="64" y="188" font-size="12.5" fill="#9aa6b5">with flowing SVG paths.</text><path id="mp" d="M64 222H284" stroke="#2c3542" stroke-width="1.5" fill="none"/><circle cx="64" cy="222" r="4" fill="#2c3542"/><circle cx="108" cy="222" r="4" fill="#2c3542"/><circle cx="152" cy="222" r="4" fill="#2c3542"/><circle cx="196" cy="222" r="4" fill="#2c3542"/><circle cx="240" cy="222" r="4" fill="#2c3542"/><circle cx="284" cy="222" r="4" fill="#2c3542"/><circle r="4.5" fill="#38bdf8" class="mv"><animateMotion dur="3.5s" repeatCount="indefinite"><mpath href="#mp"/></animateMotion></circle></g>
<g class="c" style="animation-delay:0.15s"><rect x="356" y="112" width="288" height="144" rx="10" fill="#151a22" stroke="#262d38"/><text x="380" y="146" font-size="16" font-weight="600" fill="#e8edf3">Engineering capabilities</text><text x="380" y="170" font-size="12.5" fill="#9aa6b5">Integration, SQL modeling, data</text><text x="380" y="188" font-size="12.5" fill="#9aa6b5">quality and automation.</text><rect class="pl" x="380" y="213" width="22" height="18" rx="4" fill="#38bdf8" style="animation-delay:0.0s"/><rect class="pl" x="410" y="213" width="22" height="18" rx="4" fill="#38bdf8" style="animation-delay:0.5s"/><rect class="pl" x="440" y="213" width="22" height="18" rx="4" fill="#38bdf8" style="animation-delay:1.0s"/><rect class="pl" x="470" y="213" width="22" height="18" rx="4" fill="#38bdf8" style="animation-delay:1.5s"/></g>
<g class="c" style="animation-delay:0.3s"><rect x="672" y="112" width="288" height="144" rx="10" fill="#151a22" stroke="#262d38"/><text x="696" y="146" font-size="16" font-weight="600" fill="#e8edf3">Impact metrics</text><text x="696" y="170" font-size="12.5" fill="#9aa6b5">Scroll-triggered count-ups tied to</text><text x="696" y="188" font-size="12.5" fill="#9aa6b5">the role behind each result.</text><rect class="gr" x="696" y="222" width="16" height="10" rx="2" fill="#2dd4bf" style="animation-delay:0.0s"/><rect class="gr" x="722" y="216" width="16" height="16" rx="2" fill="#2dd4bf" style="animation-delay:0.25s"/><rect class="gr" x="748" y="220" width="16" height="12" rx="2" fill="#2dd4bf" style="animation-delay:0.5s"/><rect class="gr" x="774" y="210" width="16" height="22" rx="2" fill="#2dd4bf" style="animation-delay:0.75s"/><rect class="gr" x="800" y="204" width="16" height="28" rx="2" fill="#2dd4bf" style="animation-delay:1.0s"/></g>
<g class="c" style="animation-delay:0.44999999999999996s"><rect x="40" y="272" width="288" height="144" rx="10" fill="#151a22" stroke="#262d38"/><text x="64" y="306" font-size="16" font-weight="600" fill="#e8edf3">Case studies</text><text x="64" y="330" font-size="12.5" fill="#9aa6b5">Sales &amp; Revenue Analytics and an</text><text x="64" y="348" font-size="12.5" fill="#9aa6b5">interactive data-quality demo.</text><rect x="64" y="370" width="150" height="6" rx="3" fill="#2c3542"/><path class="tk" d="M230 373l4 4 8-8" stroke="#2dd4bf" stroke-width="2" fill="none" stroke-linecap="round" style="animation-delay:0.0s"/><rect x="64" y="384" width="110" height="6" rx="3" fill="#2c3542"/><path class="tk" d="M230 387l4 4 8-8" stroke="#2dd4bf" stroke-width="2" fill="none" stroke-linecap="round" style="animation-delay:0.8s"/></g>
<g class="c" style="animation-delay:0.6s"><rect x="356" y="272" width="288" height="144" rx="10" fill="#151a22" stroke="#262d38"/><text x="380" y="306" font-size="16" font-weight="600" fill="#e8edf3">Experience timeline</text><text x="380" y="330" font-size="12.5" fill="#9aa6b5">SAGO and Diacto roles with</text><text x="380" y="348" font-size="12.5" fill="#9aa6b5">expandable details.</text><path d="M380 382H600" stroke="#2c3542" stroke-width="1.5"/><circle class="nd" cx="390" cy="382" r="5" fill="#0d1117" stroke="#38bdf8" stroke-width="2" style="animation-delay:0.0s"/><circle class="nd" cx="456" cy="382" r="5" fill="#0d1117" stroke="#38bdf8" stroke-width="2" style="animation-delay:0.7s"/><circle class="nd" cx="522" cy="382" r="5" fill="#0d1117" stroke="#38bdf8" stroke-width="2" style="animation-delay:1.4s"/><circle class="nd" cx="588" cy="382" r="5" fill="#0d1117" stroke="#38bdf8" stroke-width="2" style="animation-delay:2.0999999999999996s"/></g>
<g class="c" style="animation-delay:0.75s"><rect x="672" y="272" width="288" height="144" rx="10" fill="#151a22" stroke="#262d38"/><text x="696" y="306" font-size="16" font-weight="600" fill="#e8edf3">Stack and principles</text><text x="696" y="330" font-size="12.5" fill="#9aa6b5">Skills grouped by purpose, plus</text><text x="696" y="348" font-size="12.5" fill="#9aa6b5">five engineering principles.</text><rect class="pl" x="696" y="373" width="44" height="18" rx="9" fill="none" stroke="#38bdf8" stroke-width="1.5" style="animation-delay:0.0s"/><rect class="pl" x="748" y="373" width="56" height="18" rx="9" fill="none" stroke="#38bdf8" stroke-width="1.5" style="animation-delay:0.6s"/><rect class="pl" x="812" y="373" width="38" height="18" rx="9" fill="none" stroke="#38bdf8" stroke-width="1.5" style="animation-delay:1.2s"/><rect class="pl" x="858" y="373" width="60" height="18" rx="9" fill="none" stroke="#38bdf8" stroke-width="1.5" style="animation-delay:1.7999999999999998s"/></g>
</svg>