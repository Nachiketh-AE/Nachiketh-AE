<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Nachiketh Sudhindra Kadkol, Analytics Engineer</title>
<desc id="d">Animated pipeline: data sources, SQL transformations, analytical model, validation, and dashboard delivery.</desc>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.h{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-weight:700}
.in{opacity:0;animation:in .9s ease forwards}
@keyframes in{to{opacity:1}}
.flow{stroke-dasharray:6 8;animation:dash 1.6s linear infinite}
@keyframes dash{to{stroke-dashoffset:-14}}
.nd{fill:#151a22;stroke:#2c3542;stroke-width:1.5;animation:pulse 8s infinite}
@keyframes pulse{0%,12%,100%{stroke:#2c3542}4%,8%{stroke:#38bdf8}}
.nd.q{animation-name:pulseq}
@keyframes pulseq{0%,12%,100%{stroke:#2c3542}4%,8%{stroke:#2dd4bf}}
.bar{transform-box:fill-box;transform-origin:bottom;animation:grow 8s ease-in-out infinite}
@keyframes grow{0%,70%{transform:scaleY(.2)}85%,100%{transform:scaleY(1)}}
.tick{stroke-dasharray:30;stroke-dashoffset:30;animation:tk 8s infinite}
@keyframes tk{0%,45%{stroke-dashoffset:30}55%,100%{stroke-dashoffset:0}}
.jit{animation:jit 1.8s steps(2,end) infinite}
@keyframes jit{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.in{opacity:1}.parts{display:none}.bar{transform:none}.tick{stroke-dashoffset:0}}
</style>
<rect x=".75" y=".75" width="998.5" height="318.5" rx="14" fill="#0d1117" stroke="#262d38" stroke-width="1.5"/>

<text x="48" y="100" font-size="42" fill="#38bdf8" class="h in" style="animation-delay:.3s">Nachiketh Sudhindra Kadkol</text>
<text x="48" y="140" font-size="14" fill="#9aa6b5" class="in" style="animation-delay:.8s">Analytics Engineer · SQL · Data Modeling · Reporting Automation</text>

<!-- raw, fragmented records near the source -->
<g fill="#fbbf24" opacity=".8">
<rect class="jit" x="52" y="186" width="10" height="4" rx="1"/><rect class="jit" x="40" y="204" width="14" height="4" rx="1" style="animation-delay:.4s"/>
<rect class="jit" x="56" y="222" width="8" height="4" rx="1" style="animation-delay:.9s"/><rect class="jit" x="44" y="238" width="12" height="4" rx="1" style="animation-delay:1.3s"/>
</g>

<!-- pipeline -->
<path d="M105 212H865" class="flow" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity=".6"/>
<path id="p" d="M105 212H865" fill="none" stroke="none"/>

<g>
<rect class="nd" x="55" y="188" width="100" height="48" rx="9" style="animation-delay:0s"/>
<rect class="nd" x="245" y="188" width="100" height="48" rx="9" style="animation-delay:1.2s"/>
<rect class="nd" x="435" y="188" width="100" height="48" rx="9" style="animation-delay:2.4s"/>
<rect class="nd q" x="625" y="188" width="100" height="48" rx="9" style="animation-delay:3.6s"/>
<rect class="nd" x="815" y="188" width="100" height="48" rx="9" style="animation-delay:4.8s"/>
</g>

<!-- node contents -->
<g fill="none" stroke="#9aa6b5" stroke-width="1.5" stroke-linecap="round">
<ellipse cx="105" cy="205" rx="14" ry="5"/><path d="M91 205v14c0 3 6 5 14 5s14-2 14-5v-14"/>
<path d="M277 206l-7 6 7 6M313 206l7 6-7 6M298 203l-6 18" stroke="#38bdf8"/>
<rect x="468" y="203" width="14" height="10" rx="2"/><rect x="488" y="203" width="14" height="10" rx="2"/><rect x="478" y="219" width="14" height="10" rx="2"/><path d="M475 213v6M495 213v6M475 216h20" stroke-width="1"/>
<path class="tick" d="M663 213l8 8 17-17" stroke="#2dd4bf" stroke-width="2.5"/>
</g>
<g fill="#38bdf8"><rect class="bar" x="846" y="216" width="8" height="12" rx="1.5"/><rect class="bar" x="860" y="208" width="8" height="20" rx="1.5" style="animation-delay:.1s"/><rect class="bar" x="874" y="200" width="8" height="28" rx="1.5" style="animation-delay:.2s"/></g>

<g font-size="12" fill="#9aa6b5" text-anchor="middle">
<text x="105" y="262">sources</text><text x="295" y="262">SQL transform</text><text x="485" y="262">model</text><text x="675" y="262" fill="#2dd4bf">validate</text><text x="865" y="262">deliver</text>
</g>
<text x="48" y="300" font-size="11" fill="#6b7788">raw → modeled → reconciled → reported</text>

<!-- particles: amber and mixed before modeling, cyan after, teal once validated -->
<g class="parts">
<g id="pt"><circle r="4.5" fill="#fbbf24">
<animateMotion dur="8s" repeatCount="indefinite" begin="0s"><mpath href="#p"/></animateMotion>
<animate attributeName="fill" dur="8s" repeatCount="indefinite" begin="0s" values="#fbbf24;#fbbf24;#38bdf8;#38bdf8;#2dd4bf;#2dd4bf" keyTimes="0;.22;.3;.58;.66;1"/></circle></g>
<circle r="4.5" fill="#fbbf24"><animateMotion dur="8s" repeatCount="indefinite" begin="-1.6s"><mpath href="#p"/></animateMotion>
<animate attributeName="fill" dur="8s" repeatCount="indefinite" begin="-1.6s" values="#fbbf24;#fbbf24;#38bdf8;#38bdf8;#2dd4bf;#2dd4bf" keyTimes="0;.22;.3;.58;.66;1"/></circle>
<circle r="4.5" fill="#fbbf24"><animateMotion dur="8s" repeatCount="indefinite" begin="-3.2s"><mpath href="#p"/></animateMotion>
<animate attributeName="fill" dur="8s" repeatCount="indefinite" begin="-3.2s" values="#fbbf24;#fbbf24;#38bdf8;#38bdf8;#2dd4bf;#2dd4bf" keyTimes="0;.22;.3;.58;.66;1"/></circle>
<circle r="4.5" fill="#fbbf24"><animateMotion dur="8s" repeatCount="indefinite" begin="-4.8s"><mpath href="#p"/></animateMotion>
<animate attributeName="fill" dur="8s" repeatCount="indefinite" begin="-4.8s" values="#fbbf24;#fbbf24;#38bdf8;#38bdf8;#2dd4bf;#2dd4bf" keyTimes="0;.22;.3;.58;.66;1"/></circle>
<circle r="4.5" fill="#fbbf24"><animateMotion dur="8s" repeatCount="indefinite" begin="-6.4s"><mpath href="#p"/></animateMotion>
<animate attributeName="fill" dur="8s" repeatCount="indefinite" begin="-6.4s" values="#fbbf24;#fbbf24;#38bdf8;#38bdf8;#2dd4bf;#2dd4bf" keyTimes="0;.22;.3;.58;.66;1"/></circle>
</g>
</svg>
